/* ================= 部屋コード方式（PeerJS：ブラウザ同士を直接つなぐ） =================
   ホストが4文字の部屋コードで部屋をつくり、仲間はコードを入れて参加する。
   通信はホストを中心にした星型：参加者→ホスト→ほかの参加者 の順に中継する。
   ゲーム側からは claude.ai の room と同じ形（peers / presence / emit / on）に見える。 */
const PJ={peer:null,host:0,code:'',me:null,hostId:'',conns:new Map(),hc:null,ps:new Map(),subs:{},myP:{},state:'idle',busy:0,leaving:0,ui:null,uiVis:null,sig:'',tf:'',msg:'',msgErr:0};
const PJPFX='oborozuki-touma-v1-',PJCH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',PJLIB=['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
const pjPeerClass=()=>window.Peer||(window.peerjs&&(window.peerjs.Peer||(window.peerjs.default&&window.peerjs.default.Peer)))||null;
function pjLoadLib(){return new Promise((res,rej)=>{if(pjPeerClass())return res(pjPeerClass());let i=0;
 const nx=()=>{if(i>=PJLIB.length)return rej(new Error('lib'));const s=document.createElement('script');s.src=PJLIB[i++];s.onload=()=>pjPeerClass()?res(pjPeerClass()):nx();s.onerror=nx;document.head.appendChild(s)};nx()})}
function pjCode(){let s='';for(let i=0;i<4;i++)s+=PJCH[Math.floor(Math.random()*PJCH.length)];return s}
function pjEnt(id,p){return Object.freeze({peer:id,by:null,isMe:id===PJ.me,sameTab:id===PJ.me,kind:'viewer',guest:false,presence:Object.freeze(p&&typeof p==='object'?p:{}),updatedAt:Date.now()})}
function pjSend(c,m){try{if(c&&c.open)c.send(m)}catch(e){}}
function pjBcast(m,ex){for(const c of PJ.conns.values())if(c.peer!==ex)pjSend(c,m)}
function pjDeliver(id,topic,data){for(const f of PJ.subs[topic]||[]){try{f({peer:id,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,topic,data})}catch(e){}}}
const PJROOM={peers:()=>[...PJ.ps.values()],
 presence(patch){const p=Object.assign({},PJ.myP);for(const k in patch){if(patch[k]===null)delete p[k];else p[k]=patch[k]}PJ.myP=p;if(PJ.me)PJ.ps.set(PJ.me,pjEnt(PJ.me,p));
  if(PJ.host)pjBcast({t:'p',id:PJ.me,p});else pjSend(PJ.hc,{t:'p',p});return Promise.resolve()},
 emit(topic,data){if(PJ.host)pjBcast({t:'e',id:PJ.me,topic,data});else pjSend(PJ.hc,{t:'e',topic,data});return Promise.resolve()},
 on(topic,f){(PJ.subs[topic]=PJ.subs[topic]||[]).push(f);return()=>{}},onPeers(){return()=>{}},connected:()=>PJ.state==='open'};

/* ---- ホスト側：参加者の受け付けと中継 ---- */
function pjOnConn(c){c.on('open',()=>{if(PJ.state!=='open'){try{c.close()}catch(e){}return}
  if(!PJ.conns.has(c.peer)&&PJ.conns.size>=3){pjSend(c,{t:'full'});setTimeout(()=>{try{c.close()}catch(e){}},400);return}
  const old=PJ.conns.get(c.peer);PJ.conns.set(c.peer,c);if(old&&old!==c)try{old.close()}catch(e){}
  pjSend(c,{t:'hi',host:PJ.me});for(const e of PJ.ps.values())if(e.peer!==c.peer)pjSend(c,{t:'p',id:e.peer,p:e.presence})});
 c.on('data',m=>{if(!m||typeof m!=='object'||PJ.conns.get(c.peer)!==c)return;
  if(m.t==='p'&&m.p&&typeof m.p==='object'){PJ.ps.set(c.peer,pjEnt(c.peer,m.p));pjBcast({t:'p',id:c.peer,p:m.p},c.peer)}
  else if(m.t==='e'&&typeof m.topic==='string'){pjDeliver(c.peer,m.topic,m.data);pjBcast({t:'e',id:c.peer,topic:m.topic,data:m.data},c.peer)}});
 const gone=()=>{if(PJ.conns.get(c.peer)!==c)return;PJ.conns.delete(c.peer);PJ.ps.delete(c.peer);pjBcast({t:'x',id:c.peer})};c.on('close',gone);c.on('error',gone)}

/* ---- 参加者側：ホストから届くもの ---- */
function pjOnHostData(m){if(!m||typeof m!=='object')return;
 if(m.t==='full'){pjClosed('この部屋は満員です（最大4人）');return}
 if(m.t==='hi')return;
 if(m.t==='p'&&typeof m.id==='string'&&m.id!==PJ.me&&m.p&&typeof m.p==='object')PJ.ps.set(m.id,pjEnt(m.id,m.p));
 else if(m.t==='x'&&typeof m.id==='string')PJ.ps.delete(m.id);
 else if(m.t==='e'&&typeof m.topic==='string'&&typeof m.id==='string')pjDeliver(m.id,m.topic,m.data)}

function pjErrText(err){const t=err&&err.type;return t==='peer-unavailable'?'部屋がみつかりません':t==='browser-incompatible'?'このブラウザは通信に対応していません':
 t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'?'通信サーバーにつながりませんでした。少し待ってもう一度ためしてね':'つながりませんでした'+(t?'（'+t+'）':'')}
function pjSetup(peer,host,code,id){PJ.peer=peer;PJ.host=host;PJ.code=code;PJ.me=id;PJ.hostId=host?id:PJPFX+code;PJ.ps=new Map([[id,pjEnt(id,{})]]);PJ.myP={};PJ.state='open';PJ.busy=0;PJ.leaving=0;PJ.prevDiff=DIFF;
 NET.room=PJROOM;NET.me=null;NET.want=1;try{history.replaceState(null,'','#'+code)}catch(e){}pjMsg(host?'部屋をつくりました。コードを仲間に伝えよう':'部屋に入りました');mpTick();mpSend(1);pjUiRefresh(1)}
function pjReset(){const p=PJ.peer;PJ.leaving=1;for(const c of PJ.conns.values())try{c.close()}catch(e){}try{PJ.hc&&PJ.hc.close()}catch(e){}try{p&&p.destroy()}catch(e){}
 const wasCli=PJ.state==='open'&&!PJ.host;Object.assign(PJ,{peer:null,host:0,code:'',me:null,hostId:'',conns:new Map(),hc:null,ps:new Map(),myP:{},state:'idle',busy:0});NET.room=null;NET.me=null;if(wasCli&&PJ.prevDiff!==undefined)DIFF=PJ.prevDiff;
 try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}pjUiRefresh(1)}
function pjClosed(m){if(PJ.leaving||PJ.state==='idle')return;const inG=NET.on;pjReset();PJ.leaving=0;pjMsg(m,1);if(inG)mpQuit(m);pjOpen(1)}
function pjLeave(){if(PJ.state==='idle')return;pjReset();PJ.leaving=0;pjMsg('部屋を出ました')}

async function pjCreate(){if(PJ.busy||PJ.state!=='idle')return;if(!pjNameOk())return;PJ.busy=1;pjMsg('部屋をつくっています…');pjUiRefresh(1);let Peer;
 try{Peer=await pjLoadLib()}catch(e){PJ.busy=0;pjMsg('通信の準備に失敗しました。ネットにつながっているか確かめてね',1);pjUiRefresh(1);return}
 let tries=0;const go=()=>{const code=pjCode();let peer,done=0;try{peer=new Peer(PJPFX+code,{debug:0})}catch(e){PJ.busy=0;pjMsg(pjErrText(e),1);pjUiRefresh(1);return}
  const to=setTimeout(()=>{if(done)return;done=1;try{peer.destroy()}catch(e){}PJ.busy=0;pjMsg('通信サーバーの応答がありません。少し待ってもう一度ためしてね',1);pjUiRefresh(1)},15000);
  peer.on('open',id=>{if(done)return;done=1;clearTimeout(to);pjSetup(peer,1,code,id)});

  peer.on('error',err=>{if(!done){if(err&&err.type==='unavailable-id'&&tries++<5){done=1;clearTimeout(to);try{peer.destroy()}catch(e){}go();return}done=1;clearTimeout(to);try{peer.destroy()}catch(e){}PJ.busy=0;pjMsg(pjErrText(err),1);pjUiRefresh(1)}})};go()}

async function pjJoin(){if(PJ.busy||PJ.state!=='idle')return;if(!pjNameOk())return;const ui=PJ.ui,code=(ui.code.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');ui.code.value=code;
 if(code.length!==4){pjMsg('4文字の部屋コードを入れてね',1);ui.code.focus();return}
 PJ.busy=1;pjMsg('部屋 '+code+' につないでいます…');pjUiRefresh(1);let Peer;
 try{Peer=await pjLoadLib()}catch(e){PJ.busy=0;pjMsg('通信の準備に失敗しました。ネットにつながっているか確かめてね',1);pjUiRefresh(1);return}
 let peer,done=0;try{peer=new Peer({debug:0})}catch(e){PJ.busy=0;pjMsg(pjErrText(e),1);pjUiRefresh(1);return}
 const fail=m=>{if(done)return;done=1;clearTimeout(to);try{peer.destroy()}catch(e){}PJ.busy=0;pjMsg(m,1);pjUiRefresh(1)};
 const to=setTimeout(()=>fail('部屋がみつかりません'),15000);
